<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Séance 5 — Quiz</title>
    <style>
      :root {
        --color-primary: #0075c9;
        --color-secondary: #757575;
        --color-bg: #ffffff;
        --color-text: #212121;
        --color-border: #e0e0e0;
        --color-row-alt: #f5f5f5;
        --color-error: #f23646;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 920px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.65;
        color: var(--color-text);
        background: var(--color-bg);
      }

      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.85rem;
        font-weight: 700;
        color: var(--color-primary);
        padding-bottom: 0.6rem;
        border-bottom: 2px solid var(--color-primary);
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      .page-nav {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin: 0 0 1.25rem;
      }

      .page-nav a {
        display: inline-block;
        padding: 0.3rem 0.7rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-primary);
        text-decoration: none;
        background: transparent;
        border: 1px solid var(--color-primary);
      }

      .page-nav a:hover {
        background: var(--color-primary);
        color: #ffffff;
        text-decoration: none;
      }

      .progress {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        color: var(--color-secondary);
      }

      .question {
        border: 1px solid var(--color-border);
        padding: 1rem;
        margin-top: 1rem;
        background: var(--color-bg);
      }

      .answers {
        display: grid;
        gap: 0;
        margin: 1rem 0 0;
        border: 1px solid var(--color-border);
      }

      .answers label {
        display: block;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--color-border);
        cursor: pointer;
      }

      .answers label:last-child {
        border-bottom: none;
      }

      .answers label:nth-child(even) {
        background: var(--color-row-alt);
      }

      .answers label.correct {
        background: var(--color-row-alt);
        color: var(--color-primary);
      }

      .answers label.wrong {
        color: var(--color-error);
        text-decoration: line-through;
      }

      .answers label.checked-mode {
        cursor: default;
      }

      .option-tag {
        display: inline-block;
        margin-left: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-secondary);
      }

      button {
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--color-primary);
        background: transparent;
        color: var(--color-primary);
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--color-primary);
        color: #ffffff;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }

      #reset-btn {
        margin-left: auto;
      }

      .result {
        font-weight: 600;
        margin-top: 1rem;
      }

      .ok {
        color: var(--color-primary);
      }

      .ko {
        color: var(--color-error);
      }

      .muted {
        color: var(--color-secondary);
      }

      .question-feedback {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .status {
        margin-top: 0.75rem;
        font-size: 0.95rem;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--color-row-alt);
        color: var(--color-secondary);
        padding: 0.1em 0.35em;
      }

      em {
        font-style: italic;
      }

      .site-footer {
        margin-top: 2.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--color-border);
        text-align: center;
        font-size: 0.9rem;
        color: var(--color-secondary);
      }

      .site-footer a {
        color: var(--color-secondary);
        text-decoration: underline;
        font-weight: 400;
      }

      .site-footer a:hover {
        color: var(--color-primary);
      }
    </style>
  </head>
  <body>
    <h1>Séance 5 — Quiz</h1>
    <p><strong>Thème :</strong> Tableaux (arrays)</p>
    <nav class="page-nav">
      <a href="cours_seance_05.html">← Cours</a>
      <a href="exercices_seance_05.html">Exercices →</a>
      <a href="../../index.html">Accueil</a>
    </nav>
    <p class="muted">10 questions sur le cours de la séance 5.</p>
    <p class="progress" id="progress"></p>
    <div id="quiz"></div>

    <div class="actions">
      <button id="check-btn" type="button">Valider les réponses</button>
      <button id="reset-btn" type="button">Réinitialiser</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="summary" class="result" aria-live="polite"></div>

    <script>
      const storageKey = "quiz_seance_05_answers_v2";
      const checkedKey = "quiz_seance_05_checked_v2";

      const questions = [
        {
          id: "q1",
          text: "Pour <code>ARRAY values[0..N-1]</code>, le dernier indice valide est…",
          options: [
            { value: "A", label: "<code>0</code>" },
            { value: "B", label: "<code>N</code>" },
            { value: "C", label: "<code>N - 1</code>" },
            { value: "D", label: "<code>N + 1</code>" },
          ],
          correct: "C",
          feedback: "Les indices vont de <code>0</code> à <code>N - 1</code> inclus. Le dernier élément est <code>values[N - 1]</code>.",
        },
        {
          id: "q2",
          text: "Pour le tableau <code>[12, 7, 15, 9, 11]</code> (indices 0..4), que vaut <code>values[2]</code> ?",
          options: [
            { value: "A", label: "2" },
            { value: "B", label: "7" },
            { value: "C", label: "15" },
            { value: "D", label: "11" },
          ],
          correct: "C",
          feedback: "L'indice 2 désigne la troisième case : contenu <code>15</code>. Ne pas confondre indice et valeur.",
        },
        {
          id: "q3",
          text: "Pour parcourir toutes les cases d'un tableau de taille <code>N</code>, on écrit typiquement…",
          options: [
            { value: "A", label: "<code>FOR i = 0 TO N</code>" },
            { value: "B", label: "<code>FOR i = 0 TO N - 1</code>" },
            { value: "C", label: "<code>FOR i = 1 TO N</code>" },
            { value: "D", label: "<code>FOR i = 1 TO N - 1</code>" },
          ],
          correct: "B",
          feedback: "Indices <code>0..N-1</code> inclus. <code>TO N</code> tente <code>values[N]</code> et provoque un <em>index out of bounds</em>.",
        },
        {
          id: "q4",
          text: "Dans le calcul d'une somme sur tableau, l'accumulateur <code>sum</code> doit être…",
          options: [
            { value: "A", label: "initialisé à <code>0</code> avant la boucle" },
            { value: "B", label: "initialisé à <code>values[0]</code> uniquement, sans boucle" },
            { value: "C", label: "réinitialisé à <code>0</code> à chaque itération" },
            { value: "D", label: "égal à <code>N</code> avant de commencer" },
          ],
          correct: "A",
          feedback: "Comme en S3 : <code>sum = 0</code> une fois avant le <code>FOR</code>, puis <code>sum = sum + values[i]</code> à chaque tour.",
        },
        {
          id: "q5",
          text: "Pour trouver le minimum dans <code>values[0..N-1]</code>, une bonne initialisation est…",
          options: [
            { value: "A", label: "<code>min = 0</code>, puis boucle de <code>0</code> à <code>N - 1</code>" },
            { value: "B", label: "<code>min = values[0]</code>, puis boucle de <code>1</code> à <code>N - 1</code>" },
            { value: "C", label: "<code>min = N</code>" },
            { value: "D", label: "<code>min = values[N]</code>" },
          ],
          correct: "B",
          feedback: "On part de la première case, puis on compare les suivantes. <code>min = 0</code> échoue si toutes les valeurs sont positives (ou toutes négatives selon le cas).",
        },
        {
          id: "q6",
          text: "Dans « index of max », la variable <code>maxIndex</code> stocke…",
          options: [
            { value: "A", label: "la valeur maximale uniquement" },
            { value: "B", label: "la taille <code>N</code>" },
            { value: "C", label: "l'indice (la position) du maximum" },
            { value: "D", label: "le nombre de maxima distincts" },
          ],
          correct: "C",
          feedback: "On compare <code>values[i]</code> à <code>values[maxIndex]</code> et on met à jour l'indice. La valeur max se lit ensuite via <code>values[maxIndex]</code>.",
        },
        {
          id: "q7",
          text: "Avec <code>values = [4, 9, 2, 9, 5]</code> et un test strict <code>&gt;</code> (garder le premier max), <code>maxIndex</code> final vaut…",
          options: [
            { value: "A", label: "0" },
            { value: "B", label: "1" },
            { value: "C", label: "3" },
            { value: "D", label: "4" },
          ],
          correct: "B",
          feedback: "Le premier 9 est à l'indice 1. Le second 9 (indice 3) n'est pas strictement plus grand, donc <code>maxIndex</code> reste 1.",
        },
        {
          id: "q8",
          text: "Pour compter combien d'éléments sont strictement au-dessus d'une limite, on utilise…",
          options: [
            { value: "A", label: "uniquement un <code>IF</code> sans boucle" },
            { value: "B", label: "un compteur initialisé à <code>0</code>, un <code>FOR</code>, et un <code>IF</code> sur le critère" },
            { value: "C", label: "un <code>STEP -1</code> obligatoire" },
            { value: "D", label: "un décalage (*shift*) vers la gauche" },
          ],
          correct: "B",
          feedback: "Pattern classique : <code>count = 0</code>, parcours <code>0..N-1</code>, incrément si <code>values[i] &gt; limit</code>.",
        },
        {
          id: "q9",
          text: "Pour inverser <code>values[0..N-1]</code> <em>in-place</em>, la boucle s'arrête typiquement à…",
          options: [
            { value: "A", label: "<code>N</code> (sinon le tableau n'est pas inversé)" },
            { value: "B", label: "<code>N DIV 2 - 1</code> (sinon on ré-inverse en continuant)" },
            { value: "C", label: "<code>N + 1</code>" },
            { value: "D", label: "<code>N - 1</code>" },
          ],
          correct: "B",
          feedback: "On échange <code>i</code> avec <code>N - 1 - i</code> pour <code>i = 0 .. N DIV 2 - 1</code>. Aller jusqu'à <code>N - 1</code> annulerait l'inversion.",
        },
        {
          id: "q10",
          text: "Quel parcours provoque typiquement un <em>index out of bounds</em> pour <code>values[0..N-1]</code> ?",
          options: [
            { value: "A", label: "<code>FOR i = 0 TO N - 1</code>" },
            { value: "B", label: "<code>FOR i = 1 TO N - 1</code> après init sur <code>values[0]</code>" },
            { value: "C", label: "<code>FOR i = 0 TO N</code>" },
            { value: "D", label: "<code>FOR i = 0 TO N DIV 2 - 1</code> pour un reverse" },
          ],
          correct: "C",
          feedback: "Quand <code>i = N</code>, <code>values[i]</code> n'existe pas. C'est l'<em>off-by-one</em> le plus fréquent sur les tableaux.",
        },
      ];

      const quizEl = document.getElementById("quiz");
      const progressEl = document.getElementById("progress");
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const checkBtn = document.getElementById("check-btn");
      const resetBtn = document.getElementById("reset-btn");

      let checked = false;
      const answers = {};

      /** Display order of options (stable ids A–D); reshuffled each load / reset. */
      const optionOrder = {};

      function shuffleInPlace(arr) {
        for (let i = arr.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = arr[i];
          arr[i] = arr[j];
          arr[j] = tmp;
        }
        return arr;
      }

      function orderedOptions(question) {
        if (!optionOrder[question.id]) {
          optionOrder[question.id] = shuffleInPlace(
            question.options.map((option) => option.value)
          );
        }
        return optionOrder[question.id].map((value, i) => {
          const option = question.options.find((entry) => entry.value === value);
          return {
            ...option,
            letter: String.fromCharCode(65 + i),
          };
        });
      }

      function reshuffleOptions() {
        for (const key of Object.keys(optionOrder)) {
          delete optionOrder[key];
        }
      }

      function loadState() {
        const rawAnswers = localStorage.getItem(storageKey);
        const rawChecked = localStorage.getItem(checkedKey);

        if (rawAnswers) {
          try {
            Object.assign(answers, JSON.parse(rawAnswers));
          } catch {
            localStorage.removeItem(storageKey);
          }
        }

        checked = rawChecked === "1";
      }

      function saveState() {
        localStorage.setItem(storageKey, JSON.stringify(answers));
        localStorage.setItem(checkedKey, checked ? "1" : "0");
      }

      function answeredCount() {
        return questions.filter((question) => answers[question.id]).length;
      }

      function updateProgress() {
        progressEl.textContent = `${answeredCount()} / ${questions.length} réponse(s) cochée(s)`;
      }

      function renderQuiz() {
        quizEl.innerHTML = questions
          .map((question, index) => {
            const selected = answers[question.id] || null;
            let feedbackHtml = "";

            if (checked) {
              const isCorrect = selected === question.correct;
              const verdictClass = !selected ? "ko" : isCorrect ? "ok" : "ko";
              const verdictText = !selected
                ? "Non répondue."
                : isCorrect
                  ? `Correct. ${question.feedback}`
                  : `Incorrect. ${question.feedback}`;
              feedbackHtml = `<p class="question-feedback ${verdictClass}">${verdictText}</p>`;
            }

            const optionsHtml = orderedOptions(question)
              .map((option) => {
                const isCorrect = option.value === question.correct;
                const isChosen = option.value === selected;
                const classes = [];
                if (checked) classes.push("checked-mode");
                if (checked && isCorrect) classes.push("correct");
                if (checked && isChosen && !isCorrect) classes.push("wrong");

                let tag = "";
                if (checked && isCorrect) tag = '<span class="option-tag">bonne réponse</span>';
                else if (checked && isChosen) tag = '<span class="option-tag">réponse sélectionnée</span>';

                return `
                  <label class="${classes.join(" ")}">
                    <input
                      type="radio"
                      name="${question.id}"
                      value="${option.value}"
                      ${selected === option.value ? "checked" : ""}
                      ${checked ? "disabled" : ""}
                    />
                    ${option.letter}. ${option.label}${tag}
                  </label>
                `;
              })
              .join("");

            return `
              <section class="question" data-question-id="${question.id}">
                <h2>Question ${index + 1}</h2>
                <p><strong>${question.text}</strong></p>
                <div class="answers">${optionsHtml}</div>
                ${feedbackHtml}
              </section>
            `;
          })
          .join("");

        if (!checked) {
          quizEl.querySelectorAll('input[type="radio"]').forEach((input) => {
            input.addEventListener("change", () => {
              answers[input.name] = input.value;
              statusEl.textContent = "";
              statusEl.className = "status";
              summaryEl.innerHTML = "";
              summaryEl.className = "result";
              saveState();
              updateProgress();
            });
          });
        }

        checkBtn.hidden = checked;
        updateProgress();

        if (checked) {
          renderSummary();
        } else {
          summaryEl.innerHTML = "";
          summaryEl.className = "result";
        }
      }

      function renderSummary() {
        let score = 0;
        questions.forEach((question) => {
          if (answers[question.id] === question.correct) score += 1;
        });

        summaryEl.innerHTML = `<p class="${score === questions.length ? "ok" : "ko"}">Score : ${score} / ${questions.length}</p>`;
        summaryEl.className = "result";
      }

      function checkAll() {
        const unanswered = questions.filter((question) => !answers[question.id]);
        if (unanswered.length > 0) {
          statusEl.textContent = `Il reste ${unanswered.length} question(s) sans réponse.`;
          statusEl.className = "status ko";
          const firstMissing = quizEl.querySelector(
            `[data-question-id="${unanswered[0].id}"]`
          );
          if (firstMissing) firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        checked = true;
        statusEl.textContent = "";
        statusEl.className = "status";
        saveState();
        renderQuiz();
        summaryEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function resetQuiz() {
        for (const key of Object.keys(answers)) {
          delete answers[key];
        }
        reshuffleOptions();
        checked = false;
        localStorage.removeItem(storageKey);
        localStorage.removeItem(checkedKey);
        statusEl.textContent = "";
        statusEl.className = "status";
        summaryEl.innerHTML = "";
        summaryEl.className = "result";
        renderQuiz();
      }

      checkBtn.addEventListener("click", checkAll);
      resetBtn.addEventListener("click", resetQuiz);

      loadState();
      renderQuiz();
    </script>

    <footer class="site-footer"><a href="mailto:shuraux@he2b.be">Sylvain Huraux - HE2B - ISIB</a></footer>
  </body>
</html>
